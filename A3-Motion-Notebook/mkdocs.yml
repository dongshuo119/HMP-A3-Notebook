site_name: A3 Human Motion Research
site_description: In-context Human Motion Prediction & Generation literature notebook
theme:
  name: material
  language: zh
  palette:
    primary: green
    accent: teal
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
extra_css:
  - stylesheets/extra.css
nav:
  - 文献总览: index.md
  - 研究方向:
      - "In-context Human Motion Prediction": directions/prediction.md
      - "Context-aware Human Motion Generation": directions/generation.md
  - 维护:
      - 论文笔记模板: PAPER_TEMPLATE.md
  - 2026:
      - "In-context Human Motion Prediction":
          - "Gaussian-Mixture Latent Flow for Stochastic 3D Human Motion Prediction": papers/2026/gmlf.md
          - "HUMOF: Human Motion Forecasting in Interactive Social Scenes": papers/2026/humof.md
          - "Progressive Guessing to Fixed Point: Rethinking Human Motion Prediction with Deep Equilibrium Models": papers/2026/motiondeq.md
          - "ReMoGen: Real-time Human Interaction-to-Reaction Generation via Modular Learning from Diverse Data": papers/2026/remogen.md
          - "Unified Multi-Modal Interactive and Reactive 3D Motion Generation via Rectified Flow": papers/2026/dualflow.md
      - "Context-aware Human Motion Generation":
          - "Decoupled Generative Modeling for Human-Object Interaction Synthesis": papers/2026/dechoi.md
          - "Disentangled Hierarchical VAE for 3D Human-Human Interaction Generation": papers/2026/dhvae.md
